name: Publicar site oficial PD Soluções Digitais

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacidade.html"
      - "scripts/site-smoke.py"
      - "styles.css"
      - "screens/**"
      - "assets/**"
      - "preview/**"
      - "site-navigation.js"
      - "site-live.js"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validar site oficial antes de publicar
        run: |
          python3 scripts/site-smoke.py
          test -f index.html
          grep -q "Home V15" index.html
          test -s assets/logo-pd-oficial.webp
          test "$(find screens -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 15
          test ! -d screens/16-admin-dashboard-v2
          test ! -d screens/17-admin-solicitacoes-v2
          node --check site-navigation.js
          node --check site-live.js
      - name: Montar site no endereço principal
        run: |
          mkdir -p _site
          cp index.html styles.css privacidade.html site-navigation.js site-live.js robots.txt sitemap.xml _site/
          cp -R screens assets preview _site/
          touch _site/.nojekyll
          python3 -m http.server 8765 --directory _site > /tmp/pd-pages.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/ -o /tmp/pd-home.html
          grep -q "Home V15" /tmp/pd-home.html
          curl --fail --silent http://127.0.0.1:8765/screens/02-atendimento-v5/index.html -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/preview/ -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/assets/logo-pd-oficial.webp -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/assets/scene-workstation-official.webp -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/privacidade.html -o /dev/null
          kill $SERVER_PID
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checar resposta HTTP do site publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          SITE_URL="${SITE_URL%/}/"
          curl -fLsS --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}" -o /tmp/pd-live.html
          grep -q "Home V15" /tmp/pd-live.html
          curl -fLsS --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}screens/02-atendimento-v5/index.html" -o /dev/null
          curl -fLsS --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}preview/" -o /tmp/pd-preview.html
          grep -q "página principal" /tmp/pd-preview.html
          curl -fLsS --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}assets/logo-pd-oficial.webp" -o /dev/null
          curl -fLsS --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}assets/scene-workstation-official.webp" -o /dev/null
          curl -fLsS --retry 5 --retry-delay 3 --retry-all-errors "${SITE_URL}privacidade.html" -o /dev/null
