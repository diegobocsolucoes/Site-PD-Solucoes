name: Publicar site PD Soluções Digitais

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "artes/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar site
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          if [ -d artes ]; then cp -R artes _site/artes; fi
          touch _site/.nojekyll
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
