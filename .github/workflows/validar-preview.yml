name: Validar fontes aprovadas do Portal

on:
  push:
    branches:
      - integracao-portal-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar-fontes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch de integração
        uses: actions/checkout@v4
      - name: Reconstruir bundle e validar checksum
        run: |
          python scripts/verificar_bundle.py
          sh approved-ui/bundle/rebuild.sh
          COUNT="$(find approved-ui/sources-expanded -type f -iname '*.html' | wc -l)"
          echo "Telas HTML reconstruídas: $COUNT"
          echo "ARQUIVOS APROVADOS:"
          find approved-ui/sources-expanded -type f | sort
          test "$COUNT" -ge 15
      - name: Versionar HTML/CSS aprovados na branch de integração
        run: |
          git config user.name "PD Portal Builder"
          git config user.email "actions@users.noreply.github.com"
          git add approved-ui/sources-expanded
          if ! git diff --cached --quiet; then
            git commit -m "Importa fontes aprovadas para integração"
            git push origin HEAD:integracao-portal-preview
          fi
      - name: Montar prévia navegável com fontes originais
        run: |
          python scripts/montar_preview.py
          node --check preview-dist/preview-navigation.js
          test "$(find preview-dist/screens -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 17
          test -s preview-dist/assets/logo-pd-oficial.webp
          test -f preview-dist/mapa.html
      - name: Publicar prévia navegável como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pd-portal-preview-navegavel
          path: preview-dist/
          retention-days: 14
      - name: Disponibilizar HTML/CSS para revisão
        uses: actions/upload-artifact@v4
        with:
          name: pd-ui-aprovada-preview
          path: approved-ui/sources-expanded/
          retention-days: 14
