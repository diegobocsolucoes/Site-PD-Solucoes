<rect x="146" y="80" width="200" height="16" rx="8" fill="rgba(121,212,151,.16)"/>
<rect x="84" y="122" width="332" height="86" rx="12" class="f"/><path d="M104 150h150M104 172h100" class="l"/><rect x="104" y="184" width="70" height="14" rx="7" class="g"/>
<g opacity=".95"><circle cx="360" cy="165" r="32" class="s"/><path d="M340 180l14-20 12 12 14-24" class="l"/></g>
<rect x="84" y="222" width="100" height="88" rx="10" class="f"/><rect x="198" y="222" width="100" height="88" rx="10" class="f"/><rect x="312" y="222" width="104" height="88" rx="10" class="f"/>
<path d="M100 246h68M100 266h48M214 246h68M214 266h48M328 246h68M328 266h48" class="s"/>
<path d="M388 290l0 40 10-9 7 16 8-4-7-16 14-1z" class="y" transform="translate(-8 -22)"/>
</g>
<g class="fl2">
<rect x="418" y="140" width="116" height="214" rx="22" fill="url(#panel)" stroke="#79d497" stroke-width="3"/><rect x="456" y="150" width="40" height="6" rx="3" fill="rgba(121,212,151,.4)"/>
<rect x="430" y="172" width="92" height="50" rx="8" class="f"/><path d="M440 190h56M440 204h36" class="s"/>
<rect x="430" y="232" width="92" height="30" rx="8" class="f"/><rect x="430" y="270" width="92" height="30" rx="8" class="f"/><rect x="430" y="308" width="60" height="24" rx="12" class="g"/>
</g>
<path d="M92 360h260" class="s co"/><text x="92" y="388" class="t" font-size="14">www.suaempresa.com.br</text>
</svg>