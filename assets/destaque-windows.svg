<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-hidden="true">
<defs>
<radialGradient id="glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#58b978" stop-opacity=".30"/><stop offset="1" stop-color="#58b978" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#143222"/><stop offset="1" stop-color="#0a1710"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79d497" stop-opacity=".35"/><stop offset="1" stop-color="#79d497" stop-opacity="0"/></linearGradient>
<style>
.l{fill:none;stroke:#79d497;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.s{fill:none;stroke:#58b978;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.f{fill:rgba(88,185,120,.14);stroke:#79d497;stroke-width:2.5}
.d{fill:#0a1710;stroke:#79d497;stroke-width:2.5}
.g{fill:#79d497}
.y{fill:#e6c777}
.t{fill:#cfe9d7;font:600 15px Inter,Arial,sans-serif}
.tb{fill:#fff;font:700 18px "Space Grotesk",Inter,Arial,sans-serif}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sobe{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes corre{to{stroke-dashoffset:-40}}
@keyframes enche{0%{width:0}80%,100%{width:230px}}
@keyframes gira{to{transform:rotate(360deg)}}
.fl{animation:flutua 5s ease-in-out infinite}
.fl2{animation:flutua 6.5s ease-in-out -2s infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:sobe 3.6s ease-in-out infinite}
.pi{animation:pisca 1.6s ease-in-out infinite}
.co{stroke-dasharray:6 8;animation:corre 1.4s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

</style></defs>
<circle cx="300" cy="210" r="210" fill="url(#glow)"/>

<g class="fl">
<rect x="104" y="70" width="392" height="250" rx="18" fill="url(#panel)" stroke="#79d497" stroke-width="3"/>
<path d="M104 106h392" class="s"/><circle cx="126" cy="88" r="5" class="y"/><circle cx="144" cy="88" r="5" class="g" opacity=".7"/><circle cx="162" cy="88" r="5" class="g" opacity=".4"/>
<text x="130" y="146" class="tb">Ativação do sistema</text>
<rect x="130" y="166" width="240" height="14" rx="7" fill="rgba(121,212,151,.16)"/><rect x="130" y="166" width="240" height="14" rx="7" class="g" opacity=".9"/>
<g transform="translate(130 200)"><circle cx="14" cy="14" r="14" class="d"/><path d="M7 14l5 5 9-11" class="l"/></g><text x="162" y="220" class="t">Licença original verificada</text>
<g transform="translate(130 240)"><circle cx="14" cy="14" r="14" class="d"/><path d="M7 14l5 5 9-11" class="l"/></g><text x="162" y="260" class="t">Sistema ativado</text>
<g transform="translate(130 280)"><circle cx="14" cy="14" r="14" class="d"/><path d="M7 14l5 5 9-11" class="l"/></g><text x="162" y="300" class="t">Pronto para usar</text>
</g>
<g class="fl2">
<g transform="translate(396 150)"><path d="M62 0l62 22v44c0 40-26 68-62 82C26 134 0 106 0 66V22z" class="f" stroke-width="3.5"/><circle cx="62" cy="62" r="16" class="d"/><path d="M76 62h26M96 62v14M88 62v10" class="l"/><circle cx="62" cy="62" r="5" class="g"/></g>
<g transform="translate(60 300)"><circle cx="36" cy="36" r="34" class="d"/><circle cx="36" cy="36" r="26" class="s"/><path d="M24 37l9 9 18-20" class="l"/></g>
</g>
<path d="M514 70l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" class="y pi"/>
</svg>